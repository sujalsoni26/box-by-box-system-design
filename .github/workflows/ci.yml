# Typecheck, lint, both content validators and the unit tests (npm run check) on every pull request and on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit (the version is in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests use synchronous module hooks (Node 22.15+) and Firebase wants 24.12+; 26 is what the site is
          # developed and tested with.
          node-version: "26"
          cache: npm
      # Exactly the locked versions, without running any package's install scripts (none are needed).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
